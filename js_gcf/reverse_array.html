<!DOCTYPE html>

<body>
    <script>
        function reverse(array){
            console.log("Element in reverse order:")
            for(var i=array.length-1;i>=0;i--){
                console.log(array[i])
            }

        }
        reverse([10,20,30,40,50,60,70])
        reverse(["a","b","c","d","e"])
    </script>
</body>
</html>
