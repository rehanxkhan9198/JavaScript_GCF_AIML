<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        console.log("Random: ",Math.random())
        console.log("Round: ",Math.round(4.6))
        console.log("absolute: ",Math.abs(-10))
        console.log("floor: ",Math.floor(4.6))
        console.log("ceil: ",Math.ceil(4,6))
        console.log("Max: ",Math.max(2,40,50))
        console.log("Min: ",Math.min(2,40,50))
        console.log("Power: ",Math.pow(2,3))
        console.log("Square: ",Math.sqrt(81))
    </script>
</body>
</html>
