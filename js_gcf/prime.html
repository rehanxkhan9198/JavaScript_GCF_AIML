<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a=prompt()
        var count=0
        for(var i=1;i<=a;i++){
            if (a%i==0){
                count++
            }
        }
        if(count==2){
            document.write("Prime")
        }else{
            document.write("Not a prime")
        }
    </script>
</body>
</html>
